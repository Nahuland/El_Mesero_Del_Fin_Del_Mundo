name: QA automatico 3.27
# Correccion del smoke test: extrae el script inline sin regex

on:
  push:
    branches:
      - release/3.27-pulido-tecnico
    paths:
      - 'index.html'
      - 'El_Mesero_del_Fin_Del_Mundo_3.27_Pulido_Tecnico_RC.html'
      - '.github/workflows/qa-3.27.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-3-27:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar JavaScript, guardado y combate Richars
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const versionedHtml = fs.readFileSync('El_Mesero_del_Fin_Del_Mundo_3.27_Pulido_Tecnico_RC.html', 'utf8');
          if (versionedHtml !== html) throw new Error('El HTML principal y la copia 3.27 RC no están sincronizados.');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0 || html.indexOf('<script>', end + 9) >= 0) throw new Error('Se esperaba un único script inline principal.');
          new vm.Script(html.slice(start + 8, end), { filename: 'index.html:inline-script' });
          const required = [
            'saveVersion:50', 'mesero30save',
            'function militaryBossTurn()', 'function militaryBossAction(',
            'Ráfaga de cobertura', 'Disparo de precisión', 'Fuego de supresión',
            'Embestida blindada', 'Onda de choque', 'Ráfaga perforante',
            'Descarga de área', 'Salva final', 'Presión directa',
            'persistSave(true)',
            "function militaryAct4Checklist(m)",
            "done:!!e.evacuation", "done:!!e.trenchOrders",
            "done:!!e.flight9Manifest", "done:!!e.flight9Discrepancy",
            "done:!!e.coverupOrder", "done:!!e.aurelioRecipe",
            "done:!!m.nereaTestimony", "done:!!m.celinaBriefed",
            "done:!!m.damianConfronted", "done:!!m.hangarLogRead",
            "done:!!m.commandArchiveRead", "done:!!m.varelaDefeated",
            "done:!!m.siestaDecision",
            "case'poi_trincherasnorte':e.trenchOrders=true",
            "case'poi_aerodromo':e.flight9Discrepancy=true",
            "case'poi_puestoderadio':e.coverupOrder=true",
            "case'mil_celina'", "case'mil_damian'",
            "case'mil_hangarFlightLog'", "case'mil_fortressArchive'",
            "case'mil_fortressBoard':militaryAct4Review()",
            "if(!evidenceReady(m))", "if(!ensureMilitary().varelaDefeated)",
            "if(!ensureMilitary().act4ReviewComplete)",
            "cultReflectorProof", "cultSolarBrazier", "cultLunarBrazier", "cultPriest",
            "cultBrazierOrderComplete", "cultPriestSurrendered",
            "f.cultResolution='reconciled'",
            "case'nestVictim'", "c.carniceroTreatmentResolved=true",
            "c.carniceroTreatmentOutcome='lucidez_temporal'",
            "state.act5?.contacts?.teo==='support'",
            "El Carnicero", "la canción le devolvió unos instantes de lucidez",
            "interior:'temple'", "interior:'sanctuary'",
            "cultNoa", "cultDante", "cultDoctrineRecord", "cultRefuge",
            "f.cultNoaTrust=true", "f.cultDanteTrust=true",
            "f.cultCommunityFormed=true", "f.cultFollowersRemainDivided=true",
            "!!f.cultNoaTrust&&!!f.cultDanteTrust"
          ];
          for (const token of required) {
            if (!html.includes(token)) throw new Error('Falta comprobación: ' + token);
          }
          for (const fn of ['militaryBossTurn', 'militaryBossAction']) {
            const count = (html.match(new RegExp('function\\s+' + fn + '\\s*\\(', 'g')) || []).length;
            if (count !== 1) throw new Error(fn + ': definición encontrada ' + count + ' veces');
          }
          console.log('OK: HTML principal/RC sincronizados, sintaxis JavaScript, Acto IV, 9 patrones Richars, reconciliación de la Secta, tratamiento del Carnicero y guardado v50.');
          NODE

      - name: Instalar navegador para prueba smoke
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prueba de carga en Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const http = require('http');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            let server;
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const html = fs.readFileSync('index.html', 'utf8');
              const marker = 'updateHUD();\n})();\n</script>';
              const at = html.lastIndexOf(marker);
              if (at < 0) throw new Error('No se encontró el cierre del script para instrumentar QA.');
              const bridge = `window.__qa = {
                runCultAndFinaleChecks() {
                  const validInteriors = ['depot','patio','mall','metro','hospital','nest','catacombs','temple','sanctuary','milHangar','milFortress'];
                  const propIds = props.map(p => p.id);
                  const propIdsUnique = new Set(propIds).size === propIds.length;
                  const mapBoundsValid = props.every(p => p.x === undefined || (Number.isFinite(p.x) && Number.isFinite(p.y) && p.x >= 0 && p.x <= 420 && p.y >= 0 && p.y <= 300));
                  const interiorRefsValid = props.every(p => !p.interior || validInteriors.includes(p.interior));
                  const interiorReturnsPresent = validInteriors.every(id => props.some(p => p.interior === id && p.type === 'roomdoor'));
                  const mapStructureValid = propIdsUnique && mapBoundsValid && interiorRefsValid && interiorReturnsPresent;
                  const cultPropsPlaced = ['cultReflectorProof','cultSolarBrazier','cultLunarBrazier'].every(id => props.some(p => p.id === id && p.interior === 'temple')) && props.some(p => p.id === 'cultPriest' && p.interior === 'sanctuary') && props.some(p => p.id === 'cultDoctrineRecord' && p.interior === 'catacombs') && props.some(p => p.id === 'cultNoa' && !p.interior) && props.some(p => p.id === 'cultDante' && !p.interior) && props.some(p => p.id === 'cultRefuge' && !!p.description);
                  state.military = {
                    evidence: { evacuation:true, trenchOrders:true, flight9Manifest:true, flight9Discrepancy:false, coverupOrder:true, aurelioRecipe:true },
                    nereaTestimony:true, celinaBriefed:true, damianConfronted:true,
                    hangarLogRead:true, commandArchiveRead:true, varelaDefeated:true,
                    siestaDecision:'archive', gunboatsSabotaged:false, funesDefeated:false,
                    act4ReviewComplete:false
                  };
                  state.flags = {};
                  ensureMilitary();
                  const blockedAct4 = militaryAct4Checklist(state.military).filter(x => !x.done).length === 1;
                  militaryAct4Review();
                  const act4BlockedUntilAll13 = !state.military.act4ReviewComplete;
                  closeDialogue();
                  state.military.evidence.flight9Discrepancy = true;
                  const all13Present = militaryAct4Checklist(state.military).length === 13 && militaryAct4Checklist(state.military).every(x => x.done);
                  const optionalActionsRemainOptional = !state.military.gunboatsSabotaged && !state.military.funesDefeated && all13Present;
                  militaryAct4Review();
                  const act4ClosureWorks = state.military.act4ReviewComplete === true && state.flags.act4Complete === true;
                  closeDialogue();
                  const evidenceGateWorks = evidenceReady(state.military);
                  state.military.evidence.coverupOrder = false;
                  const incomingDamageWorks = militaryIncoming(15) === 15;
                  state.military.evidence.coverupOrder = true;
                  state.military.gunboatsSabotaged = true; state.military.funesDefeated = true;
                  const preparedDamageWorks = militaryIncoming(15) === 3;
                  state.act5 = { contacts: { mira:'support', ivan:'support', lia:'support', teo:'negotiate', noa:'reject', dante:'support', kai:'support', eva:'support' }, councilComplete:true, ending:null, transmitterDisabled:false };
                  state.military = { siestaDecision:'destroy', gunboatsSabotaged:true, funesDefeated:true, act4ReviewComplete:true };
                  state.bossPeace = true;
                  state.city = { resolution:'severed', records:true, sample:true, hospitalEvidence:true, suppliesChoice:'hospital', clinicAid:true, antidoteRecovered:true, antidoteUsedForCarnicero:false, guardianDefeated:false };
                  state.flags = { act4Complete:true };
                  const close = () => { if (dialogue) closeDialogue(); };
                  near = { id:'cultLunarBrazier' }; interact();
                  const lunarFirstBlocked = !state.flags.cultBrazierOrderComplete; close();
                  near = { id:'cultReflectorProof' }; interact(); close();
                  near = { id:'cultSolarBrazier' }; interact(); close();
                  near = { id:'cultLunarBrazier' }; interact(); close();
                  near = { id:'cultPriest' }; interact();
                  const priestBlockedWithoutTrust = !state.flags.cultResolution; close();
                  near = { id:'cultNoa' }; interact();
                  const noaChoice = !!dialogue?.choices?.length;
                  if (noaChoice) dialogue.choices[0].run();
                  close();
                  near = { id:'cultDante' }; interact();
                  const danteChoice = !!dialogue?.choices?.length;
                  if (danteChoice) dialogue.choices[0].run();
                  close();
                  near = { id:'cultDoctrineRecord' }; interact();
                  const doctrineRead = state.flags.cultDoctrineRecordRead === true; close();
                  state.act5.contacts.noa = 'support'; state.act5.contacts.dante = 'support';
                  near = { id:'cultPriest' }; interact();
                  const surrenderChoice = !!dialogue?.choices?.length;
                  if (surrenderChoice) dialogue.choices[0].run();
                  close();
                  const final6Available = finaleMetrics().mesa;
                  state.flags.cultResolution = null;
                  const final6BlockedWithoutResolution = !finaleMetrics().mesa;
                  state.flags.cultResolution = 'reconciled';
                  const final7Available = finaleMetrics().dawn;
                  state.city.antidoteUsedForCarnicero = true;
                  const final7BlockedAfterReservation = !finaleMetrics().dawn;
                  state.act5.contacts.teo = 'support';
                  state.city.guardianDefeated = true;
                  near = { id:'nestVictim' }; interact();
                  const treatmentChoice = !!dialogue?.choices?.length;
                  if (treatmentChoice) dialogue.choices[0].run();
                  close();
                  const treatmentSaved = state.city.carniceroTreatmentResolved === true && state.city.carniceroTreatmentOutcome === 'lucidez_temporal';
                  const saved = savePayload();
                  const newFlagsPersisted = saved.state.flags.cultResolution === 'reconciled' && saved.state.flags.cultNoaTrust === true && saved.state.flags.cultDanteTrust === true && saved.state.flags.cultDoctrineRecordRead === true && saved.state.flags.cultCommunityFormed === true && saved.state.city.carniceroTreatmentResolved === true && saved.state.military.act4ReviewComplete === true && saved.state.flags.act4Complete === true;
                  const contacts = { mira:'support', ivan:'support', lia:'support', teo:'negotiate', noa:'support', dante:'support', kai:'support', eva:'support' };
                  state.act5 = { contacts, councilComplete:true, ending:null, transmitterDisabled:false };
                  state.military = { siestaDecision:'destroy', elbaHelped:true };
                  state.bossPeace = true;
                  state.city = { resolution:'severed', maraFollowup:true, tomasFollowup:true, clinicAid:true };
                  state.flags = {};
                  const final1Restaurant = finaleMetrics().restaurant;
                  state.act5 = { contacts:{}, councilComplete:true, ending:null, transmitterDisabled:false };
                  state.military = { siestaDecision:'destroy' };
                  state.city = {};
                  const final2Solitary = finaleMetrics().solitary;
                  state.military = { siestaDecision:'archive', hangarLogRead:true, commandArchiveRead:true, evidence:{evacuation:true,trenchOrders:true,flight9Manifest:true,flight9Discrepancy:true,coverupOrder:true,aurelioRecipe:false} };
                  state.records = { siesta:true, signal:true };
                  state.city = { broadcast:'public', records:true, sample:true };
                  const final3Archive = finaleMetrics().archive;
                  state.military = { siestaDecision:'shared' };
                  const final4Iron = finaleMetrics().iron;
                  const final5Siesta = finaleMetrics().siesta;
                  state.military = { siestaDecision:'archive', hangarLogRead:true, commandArchiveRead:true, evidence:{flight9Manifest:true,flight9Discrepancy:true,coverupOrder:true} };
                  state.records = { siesta:true, signal:true };
                  const final8Signal = finaleMetrics().signal;
                  return { final1Restaurant, final2Solitary, final3Archive, final4Iron, final5Siesta, final8Signal, mapStructureValid, cultPropsPlaced, noaChoice, danteChoice, doctrineRead, blockedAct4, act4BlockedUntilAll13, all13Present, optionalActionsRemainOptional, act4ClosureWorks, evidenceGateWorks, incomingDamageWorks, preparedDamageWorks, lunarFirstBlocked, priestBlockedWithoutTrust, surrenderChoice, final6Available, final6BlockedWithoutResolution, final7Available, final7BlockedAfterReservation, treatmentChoice, treatmentSaved, newFlagsPersisted };
                },
                readLoadedState() {
                  return { started:state.started, flags:{...(state.flags||{})}, city:{...(state.city||{})}, military:{...(state.military||{})}, saveExists:!!localStorage.getItem('mesero30save'), continueHandler:document.getElementById('continueGame')?.onclick?.toString()||null };
                }
              };
              updateHUD();
              })();
              </script>`;
              const instrumentedHtml = html.slice(0, at) + bridge + html.slice(at + marker.length);
              server = http.createServer((req,res) => { res.writeHead(200, {'content-type':'text/html; charset=utf-8'}); res.end(instrumentedHtml); });
              await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
              const testUrl = 'http://127.0.0.1:' + server.address().port + '/';
              await page.goto(testUrl, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(1200);
              if (!(await page.locator('body').count())) throw new Error('No se creó el body.');
              if (!(await page.locator('#menu').count())) throw new Error('No aparece el menú inicial.');
              const endings = await page.evaluate(() => window.__qa.runCultAndFinaleChecks());
              if (!endings.mapStructureValid || !endings.final1Restaurant || !endings.final2Solitary || !endings.final3Archive || !endings.final4Iron || !endings.final5Siesta || !endings.final8Signal || !endings.cultPropsPlaced || !endings.noaChoice || !endings.danteChoice || !endings.doctrineRead || !endings.blockedAct4 || !endings.act4BlockedUntilAll13 || !endings.all13Present || !endings.optionalActionsRemainOptional || !endings.act4ClosureWorks || !endings.evidenceGateWorks || !endings.incomingDamageWorks || !endings.preparedDamageWorks || !endings.lunarFirstBlocked || !endings.priestBlockedWithoutTrust || !endings.surrenderChoice || !endings.final6Available || !endings.final6BlockedWithoutResolution || !endings.final7Available || !endings.final7BlockedAfterReservation || !endings.treatmentChoice || !endings.treatmentSaved || !endings.newFlagsPersisted) {
                throw new Error('Falló la simulación del Acto IV, la ubicación de los puntos de la Secta, finales 6/7 o tratamiento del Carnicero: ' + JSON.stringify(endings));
              }
              const ids = await page.locator('[id]').evaluateAll(nodes => nodes.map(node => node.id));
              const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
              if (duplicates.length) throw new Error('IDs duplicados: ' + [...new Set(duplicates)].join(', '));
              if (errors.length) throw new Error('Errores JavaScript en navegador: ' + errors.join(' | '));
              const stored = await page.evaluate(() => {
                const raw = localStorage.getItem('mesero30save');
                if (!raw) return null;
                const save = JSON.parse(raw);
                return { version:save.saveVersion, flags:save.state?.flags, city:save.state?.city, military:save.state?.military };
              });
              if (!stored || stored.version !== 50 || stored.flags?.cultResolution !== 'reconciled' || stored.flags?.cultNoaTrust !== true || stored.flags?.cultDanteTrust !== true || stored.city?.carniceroTreatmentResolved !== true || stored.military?.act4ReviewComplete !== true) {
                throw new Error('El guardado real en localStorage no conserva las nuevas banderas: ' + JSON.stringify(stored));
              }
              await page.reload({ waitUntil:'domcontentloaded' });
              await page.waitForTimeout(250);
              const rawAfterReload = await page.evaluate(() => localStorage.getItem('mesero30save'));
              if (!rawAfterReload) throw new Error('localStorage perdió el guardado después de recargar la página.');
              await page.locator('#continueGame').click();
              await page.waitForTimeout(350);
              const loaded = await page.evaluate(() => window.__qa.readLoadedState());
              if (!loaded.started || !loaded.saveExists || loaded.flags.cultResolution !== 'reconciled' || loaded.flags.cultNoaTrust !== true || loaded.flags.cultDanteTrust !== true || loaded.city.carniceroTreatmentResolved !== true || loaded.military.act4ReviewComplete !== true) {
                throw new Error('El guardado real no se recupera al continuar: ' + JSON.stringify(loaded));
              }
              await page.reload({ waitUntil:'domcontentloaded' });
              await page.waitForTimeout(200);
              await page.locator('#newGame').click();
              await page.waitForTimeout(350);
              if (await page.locator('#menu').isVisible()) throw new Error('El menú no se oculta al iniciar partida en escritorio.');
              if (!(await page.locator('#hud').isVisible())) throw new Error('El HUD no aparece al iniciar partida en escritorio.');
              if (errors.length) throw new Error('Errores JS al iniciar partida de escritorio: ' + errors.join(' | '));
              const mobile = await browser.newPage({ viewport: { width:390, height:844 }, isMobile:true, hasTouch:true });
              const mobileErrors = [];
              mobile.on('pageerror', error => mobileErrors.push(error.message));
              await mobile.goto(testUrl, { waitUntil:'domcontentloaded' });
              await mobile.waitForTimeout(250);
              if (!(await mobile.locator('#mobileControls').isVisible())) throw new Error('Los controles táctiles no aparecen en viewport móvil.');
              if (!(await mobile.locator('#mobileAct').isVisible())) throw new Error('No aparece el botón táctil de interacción.');
              const directionControls = await mobile.locator('#mobileControls [data-dir]').count();
              if (directionControls !== 8) throw new Error('Se esperaban 8 controles direccionales; encontrados: ' + directionControls);
              const touchTargetsValid = await mobile.locator('#mobileControls [data-dir]').evaluateAll(nodes => nodes.every(node => { const r=node.getBoundingClientRect(); return r.width>=44 && r.height>=44; }));
              if (!touchTargetsValid) throw new Error('Hay controles direccionales menores de 44px.');
              await mobile.locator('#newGame').click();
              await mobile.waitForTimeout(350);
              if (await mobile.locator('#menu').isVisible()) throw new Error('El menú no se oculta al iniciar partida en móvil.');
              if (!(await mobile.locator('#mobileControls').isVisible())) throw new Error('Los controles táctiles desaparecen al iniciar partida.');
              if (mobileErrors.length) throw new Error('Errores JS en viewport móvil: ' + mobileErrors.join(' | '));
              await mobile.close();
                            console.log('OK: Chromium inicia partida en escritorio y móvil, simula la estructura de mapas/interiores, el cierre 13/13 del Acto IV y las condiciones de los ocho finales, además de el arco de Noa y Dante, la secuencia de la Secta y el tratamiento del Carnicero; escritorio y viewport móvil pasan; localStorage guarda y recupera las banderas al continuar.');
            } finally {
              await browser.close();
              if (server) await new Promise(resolve => server.close(resolve));
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
